name: Build RIYA FITNESS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o RIYA_FITNESS_APK_BUILD_READY.zip

      - name: Build APK
        run: gradle --no-daemon -p RIYA_FITNESS assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIYA-FITNESS-APK
          path: RIYA_FITNESS/app/build/outputs/apk/debug/app-debug.apk
