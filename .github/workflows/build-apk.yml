name: Build RIYA FITNESS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o RIYA_FITNESS_APK_BUILD_READY.zip
          find . -name gradlew -o -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          find . -name gradlew -type f
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIYA-FITNESS-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
